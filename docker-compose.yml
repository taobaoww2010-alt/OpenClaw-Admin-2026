services:
  openclaw-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-admin
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - OPENCLAW_WS_URL=${OPENCLAW_WS_URL:-ws://127.0.0.1:18789}
      - OPENCLAW_AUTH_TOKEN=${OPENCLAW_AUTH_TOKEN:-}
      - OPENCLAW_AUTH_PASSWORD=${OPENCLAW_AUTH_PASSWORD:-}
      - HERMES_WEB_URL=${HERMES_WEB_URL:-http://localhost:9119}
      - HERMES_API_URL=${HERMES_API_URL:-http://localhost:8642}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
